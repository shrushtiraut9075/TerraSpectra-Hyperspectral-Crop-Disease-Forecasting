seed: 42
device: "cpu" # or "cuda" if available
epochs: 15
batch_size: 128
lr: 0.0003
weight_decay: 0.05
warmup_epochs: 3
patience: 8
loss: "focal" # "focal" or "weighted_ce"
focal_gamma: 2.0
focal_alpha: 0.65
mixed_precision: false
grad_accum_steps: 1
num_workers: 0
pin_memory: false

checkpoint_dir: "artifacts/checkpoints"
log_dir: "artifacts/reports"
save_best_metric: "val_f1"
